user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    upstream my-app {
        server app-forum-api:8080;
        server app2-forum-api:8080;
        server app3-forum-api:8080 weight=3;
        keepalive 10;  # Maintain up to 10 keep alive connections to the backend server [1, 2, 6]
    }

    include /etc/nginx/conf.d/proxy.conf;
    include /etc/nginx/mime.types;
    include /etc/nginx/fastcgi_params;
    include /etc/nginx/scgi_params;
    include /etc/nginx/uwsgi_params;
    
    index index.html index.htm;
    
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {

        listen 80;
        listen 443 default_server ssl;

        ssl_certificate certs/server.pem;
        ssl_certificate_key certs/server.key;

        server_name _;
        root /usr/share/nginx/html;

        location /lancaerro {
            proxy_pass http://my-app/topicos/lancaerro;
        }

        location /topicos {
            proxy_pass http://my-app/topicos;
        }

        location ~ /topicos/([0-9]+)$ {
            proxy_pass http://my-app/topicos/$1;
        }
        
        location /auth {
            proxy_pass http://my-app/auth;
        }

        location /info {
            proxy_pass http://my-app/actuator/info;
        }
        
        location /metrics {
            proxy_pass http://my-app/actuator/prometheus;
        }
        
        location /health {
            proxy_pass http://my-app/actuator/health;
        }

        location /images {
            access_log off;
            return 204;
        }
    }
}

